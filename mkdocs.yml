site_name: pyordering
site_description: Sort orders as composable values that sort in memory, compile from JSON and render to ORM order_by clauses.
site_url: https://aaltatan.github.io/pyordering/
repo_url: https://github.com/aaltatan/pyordering
repo_name: aaltatan/pyordering
edit_uri: edit/main/docs/
copyright: GPL-3.0-only

theme:
  name: material
  icon:
    logo: material/sort
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Keys and orderings: guide/orderings.md
      - Registries: guide/registries.md
      - Compiling orderings from JSON: guide/compiling.md
      - JSON Schema: guide/json-schema.md
      - SQLAlchemy and Django: guide/orms.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - API: reference/api.md
      - JSON format: reference/json-format.md
      - Exceptions: reference/exceptions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/pyordering
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyordering/
